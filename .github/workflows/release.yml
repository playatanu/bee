name: Release

# Build the Linux .deb and the Windows installer, and publish them to a
# GitHub Release. Triggered by pushing a version tag, e.g.:
#     git tag v0.3.4 && git push origin v0.3.4
# `workflow_dispatch` builds the artifacts too (without creating a release),
# which is handy for testing the pipeline.
#
# The glob is 'v[0-9]*', not 'v*': the latter also matched tags like
# vscode-beelang-v0.1.0 and tried to build a .deb out of them.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Linux .deb
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (incl. LLVM for the JIT)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make fakeroot llvm-18-dev

      - name: Build the .deb
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.3.4"
          fi
          bash packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  # ------------------------------------------------------------ Windows installer
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A reliable MinGW-w64 toolchain (UCRT), plus LLVM built for the *same*
      # toolchain so it is ABI-compatible with this g++. The JIT backend links
      # against it; bee.exe itself links no LLVM (it dlopen's the backend).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-llvm

      - name: Compile bee.exe, hive.exe, beegen.exe and the JIT backend
        shell: msys2 {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.3.4"; fi
          # bee.exe links no LLVM. src/*.cpp includes src/jit.cpp (the dlopen
          # front end) and src/jit_llvm.cpp (guarded to nothing without BEE_JIT).
          g++ -std=c++17 -O2 -static -pthread -DBEE_VERSION="\"$ver\"" \
              src/*.cpp -o packaging/windows/bee.exe
          # The LLVM JIT backend, dlopen'd by bee.exe on first compile. -static
          # makes the DLL self-contained; --link-static folds LLVM in too. It
          # shares bee.exe's heap through ucrtbase.dll (UCRT), so std containers
          # returned across the boundary are freed on the same heap.
          # --exclude-all-symbols: without it MinGW auto-exports every global
          # symbol, and with LLVM statically folded in that is far more than the
          # 65535 a PE export table can hold ("export ordinal too large"). bee.exe
          # only looks up bee_jit_create, which is kept via __declspec(dllexport).
          g++ -std=c++17 -O2 -static -pthread -DBEE_VERSION="\"$ver\"" -DBEE_JIT -fno-rtti \
              -I"$(llvm-config --includedir)" -shared -Wl,--exclude-all-symbols \
              -o packaging/windows/bee_jit.dll \
              src/jit_llvm.cpp \
              $(llvm-config --ldflags --link-static --libs core orcjit native passes --system-libs)
          g++ -std=c++17 -O2 -static -pthread -DHIVE_VERSION="\"$ver\"" \
              src/hive/*.cpp -o packaging/windows/hive.exe
          # beegen loads libclang at run time; nothing to link against here.
          g++ -std=c++17 -O2 -pthread -DBEEGEN_VERSION="\"$ver\"" \
              src/beegen/*.cpp -o packaging/windows/beegen.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $ver = '0.3.4'
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\windows\bee-setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------- Release
  release:
    needs: [linux-deb, windows-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
